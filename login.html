<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · Spielplan-App</title>
  <meta name="referrer" content="no-referrer">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js" integrity="sha384-2zrRDgDHSYB/GN3nFW3fsZXoxEhKIr3N2h63Tc6DEOB9JJdFIu8xMJT2Cph/gBil" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/sicherheit.js"></script>
  <script src="js/symbole.js"></script>
  <link rel="stylesheet" href="css/premium.css">
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 16px; }
    .brand { margin-bottom: 26px; }
    .card {
      width: 100%; max-width: 420px; overflow: hidden;
      background: linear-gradient(180deg, rgba(23,43,71,0.92), rgba(16,30,52,0.94));
      border: 1px solid var(--rand-stark); border-radius: 18px; box-shadow: 0 18px 50px rgba(0,0,0,0.45);
    }
    .card-header {
      position: relative; padding: 22px 24px 18px;
      background: linear-gradient(135deg, rgba(240,122,34,0.18) 0%, rgba(23,43,71,0) 55%);
      border-bottom: 1px solid var(--rand);
      display: flex; gap: 14px; align-items: center;
    }
    .card-header::after { content: ''; position: absolute; left: 24px; right: 24px; bottom: -1px; height: 2px; background: linear-gradient(90deg, var(--orange), rgba(240,122,34,0)); }
    .kopf-sym { width: 44px; height: 44px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: rgba(240,122,34,0.14); color: var(--orange2); flex-shrink: 0; }
    .kopf-sym .sym { width: 22px; height: 22px; }
    .card-header h1 { font-family: var(--schrift-k); font-weight: 700; font-size: 24px; line-height: 1.15; }
    .card-header p { font-size: 14px; color: var(--text2); margin-top: 2px; }
    .card-body { padding: 22px 24px 24px; }
    .field { margin-bottom: 16px; }
    .eingabe-mit-sym { position: relative; }
    .eingabe-mit-sym .sym { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--muted); pointer-events: none; }
    .eingabe-mit-sym .eingabe { padding-left: 40px; font-size: 16px; }
    .btn-login {
      width: 100%; margin-top: 4px; padding: 14px;
      background: linear-gradient(180deg, #ff8a2e, #e8670f); color: #fff; border: 1px solid #ff9440; border-radius: 12px;
      font-family: var(--schrift-k); font-weight: 700; font-size: 18px; cursor: pointer; box-shadow: 0 6px 20px rgba(240,122,34,0.35);
    }
    .btn-login:disabled { opacity: 0.6; cursor: wait; }
    .error-msg { background: var(--rot-bg); border: 1px solid rgba(255,90,82,0.4); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: #ffb3ae; margin-top: 14px; }
    .footer { font-size: 13px; color: var(--muted); text-align: center; margin-top: 22px; }
  </style>
</head>
<body>
<div class="brand marke">
  <span id="marke-logo"></span>
  <div>
    <div class="marke-titel">Spielplan-App · <em>FC Strass e.V.</em></div>
    <div class="marke-sub">Mannschaftsführer-Bereich</div>
  </div>
</div>
<div class="card">
  <div class="card-header">
    <span class="kopf-sym" data-sym="schloss"></span>
    <div>
      <h1>Anmelden</h1>
      <p>Zugang nur für Mannschaftsführer und Admins</p>
    </div>
  </div>
  <div class="card-body">
    <div class="field">
      <label class="feld-label" for="email">E-Mail</label>
      <div class="eingabe-mit-sym"><span data-sym="mail"></span><input class="eingabe" type="email" id="email" placeholder="deine@email.de" autocomplete="email"></div>
    </div>
    <div class="field">
      <label class="feld-label" for="passwort">Passwort</label>
      <div class="eingabe-mit-sym"><span data-sym="schloss"></span><input class="eingabe" type="password" id="passwort" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter') anmelden()"></div>
    </div>
    <button class="btn-login" onclick="anmelden()" id="btn-login">Anmelden</button>
    <div id="error-box"></div>
  </div>
</div>
<div class="footer">Probleme beim Login? Wende dich an Christian Aust.</div>

<script>
const sb = window.supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON);

// Feste Symbole (nur Konstanten)
document.querySelectorAll('[data-sym]').forEach(function (el) {
  var f = SYM[el.getAttribute('data-sym')];
  if (f) el.innerHTML = f();
});
document.getElementById('marke-logo').outerHTML = SYM.marke();

// Bereits eingeloggt? Direkt weiterleiten
sb.auth.getSession().then(function(res) {
  if (res.data && res.data.session) {
    window.location.href = 'index.html';
  }
});

async function anmelden() {
  const email    = document.getElementById('email').value.trim();
  const passwort = document.getElementById('passwort').value;
  const btn      = document.getElementById('btn-login');
  if (!email || !passwort) { zeigeFehler('Bitte E-Mail und Passwort eingeben.'); return; }
  btn.disabled = true;
  btn.textContent = 'Anmelden...';
  document.getElementById('error-box').innerHTML = '';
  const { error } = await sb.auth.signInWithPassword({ email: email, password: passwort });
  if (error) {
    zeigeFehler(/fetch|network/i.test(error.message || '')
      ? 'Keine Verbindung zum Server. Bitte Internetverbindung prüfen.'
      : 'Anmeldung fehlgeschlagen. E-Mail oder Passwort falsch.');
    btn.disabled = false;
    btn.textContent = 'Anmelden';
    return;
  }
  window.location.href = 'index.html';
}

function zeigeFehler(msg) {
  document.getElementById('error-box').innerHTML = '<div class="error-msg" role="alert">' + SPS.esc(msg) + '</div>';
}
</script>
</body>
</html>
